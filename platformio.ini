; Budzik - konfiguracja PlatformIO
; Projekt w ESP-IDF (bez Arduino). Płytka: ESP32-WROOM (esp32dev).
; Platforma pioarduino 55.03.37 (ESP-IDF 5.5.2).

[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.37/platform-espressif32.zip
board = esp32dev
framework = espidf
monitor_speed = 115200
monitor_rts = 0
monitor_dtr = 0
monitor_raw = yes
; Szybsze wgrywanie (460800) przerywało się u autora (kabel/CP2102), 115200 działa
upload_speed = 115200
; Dokładna wersja sprawdzona na zegarze: nowsza z "^" mogłaby po cichu zmienić rysowanie ekranu
lib_deps = lovyan03/LovyanGFX@1.2.36
; Dwa miejsca na program: aktualizacja przez Wi-Fi (OTA) z powrotem do starej wersji przy błędzie
; (rollback w sdkconfig.esp32dev)
board_build.partitions = partycje_ota.csv
; Wersja z Git do src/wersja.h (strona, panel "Stan zegara")
extra_scripts = pre:wersja.py
build_flags =
    -Wno-deprecated-declarations
# Workaround to make inspection work, see https://github.com/platformio/platformio-core/issues/3951#issuecomment-993968462
check_skip_packages = yes
